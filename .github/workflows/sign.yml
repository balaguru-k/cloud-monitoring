name: Cosign Sign and Tamper Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sign-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Show original file
        run: |
          echo "Original password.txt:"
          cat password.txt

      - name: Sign password.txt
        run: |
          cosign sign-blob password.txt \
            --bundle pass.sigstore.json \
            --yes

      - name: Verify original file
        run: |
          cosign verify-blob password.txt \
            --bundle pass.sigstore.json \
            --certificate-identity="https://github.com/balaguru-k/cloud-monitoring/.github/workflows/sign.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Tamper with password.txt
        run: |
          echo "Tampering with password.txt..."
          echo "HACKED_PASSWORD_456" > password.txt

          echo "Modified password.txt:"
          cat password.txt

      - name: Verify modified file - MUST FAIL
        run: |
          set +e

          cosign verify-blob password.txt \
            --bundle pass.sigstore.json \
            --certificate-identity="https://github.com/balaguru-k/cloud-monitoring/.github/workflows/sign.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

          RESULT=$?

          if [ $RESULT -eq 0 ]; then
            echo "ERROR: Modified file was incorrectly verified!"
            exit 1
          else
            echo "SUCCESS: Tampering detected!"
            echo "The modified password.txt does NOT match the signed bundle."
          fi
