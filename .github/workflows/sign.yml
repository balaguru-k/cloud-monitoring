name: Cosign Sign and Tamper Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sign-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Show original file
        run: |
          echo "Original password.txt:"
          cat password.txt

      - name: Sign password.txt
        run: |
          cosign sign-blob password.txt \
            --bundle pass.sigstore.json \
            --yes

      - name: Verify original password.txt
        run: |
          cosign verify-blob password.txt \
            --bundle pass.sigstore.json \
            --certificate-identity="https://github.com/balaguru-k/cloud-monitoring/.github/workflows/sign.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Calculate original SHA256
        run: |
          sha256sum password.txt

      - name: Tamper with password.txt
        run: |
          echo "Seucre@2026" > password.txt

          echo "Modified password.txt:"
          cat password.txt

      - name: Verify modified password.txt
        run: |
          set +e

          cosign verify-blob password.txt \
            --bundle pass.sigstore.json \
            --certificate-identity="https://github.com/balaguru-k/cloud-monitoring/.github/workflows/sign.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

          RESULT=$?

          if [ $RESULT -ne 0 ]; then
            echo "SUCCESS: Tampering detected!"
            exit 0
          else
            echo "WARNING: Cosign still reports Verified OK."
            echo "The bundle verification is not being used as a content-integrity check here."
            exit 1
          fi
